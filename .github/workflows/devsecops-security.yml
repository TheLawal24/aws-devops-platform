name: DevSecOps Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create report directory
        run: mkdir -p security-reports

      # ---------------------------------------------------------
      # 1. GITLEAKS - BLOCKING
      # ---------------------------------------------------------
      - name: Install Gitleaks
        shell: bash
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' \
            | cut -d '"' -f 4)

          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Gitleaks secret scan
        shell: bash
        run: |
          set -o pipefail

          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            2>&1 | tee security-reports/gitleaks.txt

      # ---------------------------------------------------------
      # 2. SEMGREP - BLOCKING
      # ---------------------------------------------------------
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Semgrep SAST
        shell: bash
        run: |
          set -o pipefail

          semgrep scan \
            --config auto \
            --error \
            app \
            2>&1 | tee security-reports/semgrep.txt

      # ---------------------------------------------------------
      # 3. CHECKOV - REPORT / BASELINE
      # ---------------------------------------------------------
      - name: Install Checkov
        run: |
          python -m pip install checkov

      - name: Checkov Terraform scan
        shell: bash
        run: |
          set -o pipefail

          checkov \
            -d terraform \
            --framework terraform \
            --soft-fail \
            2>&1 | tee security-reports/checkov.txt

      # ---------------------------------------------------------
      # 4. TRIVY
      # ---------------------------------------------------------
      - name: Install Trivy
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      - name: Trivy application scan
        shell: bash
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --no-progress \
            --exit-code 0 \
            app \
            2>&1 | tee security-reports/trivy-app.txt

      - name: Trivy Terraform scan
        shell: bash
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --no-progress \
            --exit-code 0 \
            --skip-dirs terraform/environments/dev/.terraform \
            --skip-dirs terraform/bootstrap/state/.terraform \
            terraform \
            2>&1 | tee security-reports/trivy-terraform.txt

      # ---------------------------------------------------------
      # SECURITY REPORTS
      # ---------------------------------------------------------
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-security-reports
          path: security-reports/
          retention-days: 14
