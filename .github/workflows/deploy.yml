name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: aws-devops-platform-dev
  ECS_CLUSTER: aws-devops-platform-dev-cluster

  STAGING_SERVICE: aws-devops-platform-staging-service
  STAGING_TASK_FAMILY: aws-devops-platform-staging

  PRODUCTION_SERVICE: aws-devops-platform-dev-service
  PRODUCTION_TASK_FAMILY: aws-devops-platform-dev

  CONTAINER_NAME: app
  ALB_NAME: aws-devops-platform-dev-alb
  STAGING_PORT: "8088"

  AWS_ROLE_ARN: arn:aws:iam::808935753572:role/aws-devops-platform-dev-github-actions-role

jobs:
  build:
    name: Build, Scan and Publish
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            -t "${IMAGE_URI}" \
            ./app

          docker push "${IMAGE_URI}"

          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: ECR vulnerability gate
        shell: bash
        run: |
          echo "Waiting for ECR vulnerability scan for ${GITHUB_SHA}..."

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            STATUS=$(aws ecr describe-image-scan-findings \
              --region "${AWS_REGION}" \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id imageTag="${GITHUB_SHA}" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || true)

            echo "Scan ${attempt}/${MAX_ATTEMPTS}: ${STATUS:-not-ready}"

            if [ "${STATUS}" = "COMPLETE" ]; then
              break
            fi

            if [ "${STATUS}" = "FAILED" ]; then
              echo "ECR vulnerability scan failed."
              exit 1
            fi

            if [ "${attempt}" -eq "${MAX_ATTEMPTS}" ]; then
              echo "Timed out waiting for ECR vulnerability scan."
              exit 1
            fi

            sleep "${SLEEP_SECONDS}"
          done

          CRITICAL=$(aws ecr describe-image-scan-findings \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id imageTag="${GITHUB_SHA}" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)

          HIGH=$(aws ecr describe-image-scan-findings \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id imageTag="${GITHUB_SHA}" \
            --query 'imageScanFindings.findingSeverityCounts.HIGH' \
            --output text)

          [ "${CRITICAL}" = "None" ] || [ -z "${CRITICAL}" ] && CRITICAL=0
          [ "${HIGH}" = "None" ] || [ -z "${HIGH}" ] && HIGH=0

          echo "CRITICAL findings: ${CRITICAL}"
          echo "HIGH findings: ${HIGH}"

          if [ "${CRITICAL}" -gt 0 ]; then
            echo "SECURITY GATE FAILED."
            exit 1
          fi

          echo "Security gate passed."

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify staging image
        run: |
          echo "Staging image:"
          echo "${{ needs.build.outputs.image_uri }}"

      - name: Download current staging task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${STAGING_TASK_FAMILY}" \
            --query taskDefinition \
            > staging-task-definition.json

      - name: Create new staging task definition revision
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          jq \
            --arg IMAGE "${IMAGE_URI}" \
            --arg CONTAINER "${CONTAINER_NAME}" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            (.containerDefinitions[] | select(.name == $CONTAINER) | .image) = $IMAGE
            ' \
            staging-task-definition.json > staging-task-definition-new.json

          aws ecs register-task-definition \
            --cli-input-json file://staging-task-definition-new.json \
            > staging-registered-task-definition.json

          STAGING_TASK_DEFINITION_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' staging-registered-task-definition.json)

          echo "STAGING_TASK_DEFINITION_ARN=${STAGING_TASK_DEFINITION_ARN}" >> "$GITHUB_ENV"

      - name: Deploy to staging
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${STAGING_SERVICE}" \
            --task-definition "${STAGING_TASK_DEFINITION_ARN}"

      - name: Wait for staging deployment completion
        shell: bash
        run: |
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=15

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            ROLLOUT_STATE=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${STAGING_SERVICE}" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' \
              --output text)

            RUNNING=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${STAGING_SERVICE}" \
              --query 'services[0].runningCount' \
              --output text)

            DESIRED=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${STAGING_SERVICE}" \
              --query 'services[0].desiredCount' \
              --output text)

            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: rollout=${ROLLOUT_STATE}, running=${RUNNING}/${DESIRED}"

            if [ "${ROLLOUT_STATE}" = "COMPLETED" ] && [ "${RUNNING}" = "${DESIRED}" ]; then
              echo "Staging ECS deployment completed successfully."
              exit 0
            fi

            if [ "${ROLLOUT_STATE}" = "FAILED" ]; then
              echo "Staging deployment failed or rolled back."

              aws ecs describe-services \
                --cluster "${ECS_CLUSTER}" \
                --services "${STAGING_SERVICE}" \
                --query 'services[0].events[0:10].[createdAt,message]' \
                --output table

              exit 1
            fi

            sleep "${SLEEP_SECONDS}"
          done

          echo "Timed out waiting for staging deployment."

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${STAGING_SERVICE}" \
            --query 'services[0].events[0:10].[createdAt,message]' \
            --output table

          exit 1

      - name: Confirm staging was not rolled back
        shell: bash
        run: |
          DEPLOYED_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${STAGING_SERVICE}" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' \
            --output text)

          echo "Expected: ${STAGING_TASK_DEFINITION_ARN}"
          echo "Running:  ${DEPLOYED_TASK_DEFINITION}"

          if [ "${DEPLOYED_TASK_DEFINITION}" != "${STAGING_TASK_DEFINITION_ARN}" ]; then
            echo "STAGING DEPLOYMENT FAILED: ECS rolled back."
            exit 1
          fi

          echo "Staging deployment confirmed."

      - name: Test staging health endpoint
        shell: bash
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${ALB_NAME}" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          STAGING_URL="http://${ALB_DNS}:${STAGING_PORT}"

          echo "Testing ${STAGING_URL}/health"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${STAGING_URL}/health"; then
              echo
              echo "Staging health check passed."
              exit 0
            fi

            echo "Health attempt ${attempt}/12 failed. Retrying..."
            sleep 10
          done

          echo "Staging health check failed."
          exit 1

  deploy-production:
    name: Deploy to Production
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify approved image
        run: |
          echo "Approved production image:"
          echo "${{ needs.build.outputs.image_uri }}"

      - name: Download current production task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${PRODUCTION_TASK_FAMILY}" \
            --query taskDefinition \
            > production-task-definition.json

      - name: Create new production task definition revision
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          jq \
            --arg IMAGE "${IMAGE_URI}" \
            --arg CONTAINER "${CONTAINER_NAME}" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            (.containerDefinitions[] | select(.name == $CONTAINER) | .image) = $IMAGE
            ' \
            production-task-definition.json > production-task-definition-new.json

          aws ecs register-task-definition \
            --cli-input-json file://production-task-definition-new.json \
            > production-registered-task-definition.json

          PRODUCTION_TASK_DEFINITION_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' production-registered-task-definition.json)

          echo "PRODUCTION_TASK_DEFINITION_ARN=${PRODUCTION_TASK_DEFINITION_ARN}" >> "$GITHUB_ENV"

      - name: Deploy approved task definition
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${PRODUCTION_SERVICE}" \
            --task-definition "${PRODUCTION_TASK_DEFINITION_ARN}"

      - name: Wait for production deployment completion
        shell: bash
        run: |
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=15

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            ROLLOUT_STATE=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${PRODUCTION_SERVICE}" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' \
              --output text)

            RUNNING=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${PRODUCTION_SERVICE}" \
              --query 'services[0].runningCount' \
              --output text)

            DESIRED=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${PRODUCTION_SERVICE}" \
              --query 'services[0].desiredCount' \
              --output text)

            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: rollout=${ROLLOUT_STATE}, running=${RUNNING}/${DESIRED}"

            if [ "${ROLLOUT_STATE}" = "COMPLETED" ] && [ "${RUNNING}" = "${DESIRED}" ]; then
              echo "Production ECS deployment completed successfully."
              exit 0
            fi

            if [ "${ROLLOUT_STATE}" = "FAILED" ]; then
              echo "Production deployment failed or rolled back."

              aws ecs describe-services \
                --cluster "${ECS_CLUSTER}" \
                --services "${PRODUCTION_SERVICE}" \
                --query 'services[0].events[0:10].[createdAt,message]' \
                --output table

              exit 1
            fi

            sleep "${SLEEP_SECONDS}"
          done

          echo "Timed out waiting for production deployment."

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${PRODUCTION_SERVICE}" \
            --query 'services[0].events[0:10].[createdAt,message]' \
            --output table

          exit 1

      - name: Confirm production was not rolled back
        shell: bash
        run: |
          DEPLOYED_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${PRODUCTION_SERVICE}" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' \
            --output text)

          echo "Expected: ${PRODUCTION_TASK_DEFINITION_ARN}"
          echo "Running:  ${DEPLOYED_TASK_DEFINITION}"

          if [ "${DEPLOYED_TASK_DEFINITION}" != "${PRODUCTION_TASK_DEFINITION_ARN}" ]; then
            echo "PRODUCTION DEPLOYMENT FAILED: ECS rolled back."
            exit 1
          fi

          echo "Production deployment confirmed."

      - name: Verify production service
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${PRODUCTION_SERVICE}" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition}' \
            --output table
